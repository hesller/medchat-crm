name: Publish MedChat CRM image

# Builds the FOSS image of this fork (enterprise/ is stripped, same as upstream's publish
# workflow) and pushes ghcr.io/<owner>/<repo>:<version>, then publishes a GitHub release with the
# same name. Deliberately no `latest` tag: the VPS compose pins an explicit version, so a push
# never changes what is running.
#
# Versions are three numbers, MAJOR.MINOR.PATCH (4.0.1, 4.0.2, 4.1.0, ...). Push a tag named
# v<version> (git tag v4.0.1 && git push origin v4.0.1) or run it from the Actions tab. The
# image is tagged <version> (no "v") and that is also what the app reports as its version.
# The upstream base is recorded in the image label io.hexcode.upstream.

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, three numbers (e.g. 4.0.1)'
        required: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        run: |
          RAW="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${RAW#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be three numbers (MAJOR.MINOR.PATCH), got: ${RAW}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_ENV"
          echo "UPSTREAM=$(cat VERSION_CW)" >> "$GITHUB_ENV"

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Update version in app.yml
        run: |
          echo "Updating version to: ${VERSION}"
          sed -i "s/version: '.*'/version: '${VERSION}'/" config/app.yml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}
          labels: |
            io.hexcode.version=${{ env.VERSION }}
            io.hexcode.upstream=${{ env.UPSTREAM }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The app compares its own version with the latest release of this repository (see
      # Internal::CheckNewVersionsJob) to show the "update available" banner.
      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            --title "MedChat CRM ${VERSION}" \
            --notes "Image: \`${IMAGE}:${VERSION}\` (upstream base ${UPSTREAM})" \
            --verify-tag

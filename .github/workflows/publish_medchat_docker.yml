name: Publish MedChat CRM image

# Builds the FOSS image of this fork (enterprise/ is stripped, same as upstream's publish
# workflow) and pushes ghcr.io/<owner>/<repo>:<tag>. Deliberately no `latest` tag: the VPS
# compose pins an explicit tag, so a push never changes what is running.
#
# Run it by pushing a tag named medchat-v*, or from the Actions tab (workflow_dispatch).

permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - 'medchat-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. medchat-v1)'
        required: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="$(echo "$TAG" | sed 's/[^A-Za-z0-9_.-]/-/g')"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Update version in app.yml
        run: |
          VERSION="$(cat VERSION_CW)-${TAG}"
          echo "Updating version to: ${VERSION}"
          sed -i "s/version: '.*'/version: '${VERSION}'/" config/app.yml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
